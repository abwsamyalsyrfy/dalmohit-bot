services:
  - type: worker
    name: telegram-tazkiah-bot
    runtime: python
    # ⬇️ عدّل هذا الرابط إلى مستودعك على GitHub أو اربطه من واجهة Render
    repo: https://github.com/your-username/telegram-library-bot
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      # اختياري: رابط قاعدة بيانات MySQL للمزامنة الخارجية
      # - key: DATABASE_URL
      #   sync: false
      # اختياري: معرفات مشرفين إضافيين مفصولة بفواصل
      # - key: ADMIN_IDS
      #   sync: false
